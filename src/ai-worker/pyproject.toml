[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filelens-ai-worker"
version = "0.3.0"
description = "FileLens Local AI Worker for Arabic and English OCR and Document Processing"
readme = "README.md"
authors = [{ name = "FileLens Project" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "pypdfium2>=4.20.0"
]

[project.optional-dependencies]
paddle = [
    "paddlepaddle>=2.5.0",
    "paddleocr>=2.7.0"
]
tesseract = [
    "pytesseract>=0.3.10"
]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]

